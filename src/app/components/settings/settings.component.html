        ></path>
      </g>
    </svg>
  </button>
  <div class="controls-menu" [class.controls-menu--open]="isOpen">
    <button class="controls-button">restart</button>
    <div>
      <button class="mute-btn controls-button" (click)="toggleMute()">
        {{ isMuted ? '🔇' : '🔊' }}
      </button>
      <input
        id="volume"
        type="range"
        min="0"
        max="1"
        step="0.01"
        [value]="volume"
        (input)="onVolumeChange($event)"
      />
      <span class="volume-value">{{ volume * 100 | number: '1.0-0' }}%</span>
    </div>
  </div>
</div>
