    class="controls-menu--help"
    [class.controls-menu--open]="isOpen"

      <input
        id="volume"
        type="range"
        min="0"
        max="1"
        step="0.01"
        [value]="volume"
        (input)="onVolumeChange($event)"
      />
      <div class="controls-audio-value bagel">
        {{ volume * 100 | number: '1.0-0' }}%
      </div>
