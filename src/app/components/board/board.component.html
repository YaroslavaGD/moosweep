<div class="board">
  <div class="field">
    <app-cell *ngFor="let _ of cells"></app-cell>
  </div>
  <app-cow
    [x]="playerPosition()!.x"
    [y]="playerPosition()!.y"
    [direction]="direction()!"
  ></app-cow>
</div>
<div class="controls">
  <button (click)="boardService.move('up')">⬆️</button>
  <button (click)="boardService.move('down')">⬇️</button>
  <button (click)="boardService.move('left')">⬅️</button>
  <button (click)="boardService.move('right')">➡️</button>
</div>
