<div class="board">
  <app-cell *ngFor="let _ of cells"></app-cell>
  <app-cow [x]="cowX" [y]="cowY" [direction]="direction"></app-cow>
</div>
<div class="controls">
  <button (click)="move('up')">⬆️</button>
  <button (click)="move('down')">⬇️</button>
  <button (click)="move('left')">⬅️</button>
  <button (click)="move('right')">➡️</button>
</div>
